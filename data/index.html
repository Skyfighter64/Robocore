<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ESP32 WebSocket Server</title>
    <script type="text/javascript" src="script.js"></script>
    <link rel="stylesheet" type="text/css" href="style.css">
  </head>
  <body>
    <h1>ESP32 Robot Websocket Server</h1>
    <div align="center"> 
        <h2>Log:</h2>
        <pre id="log_text" style="text-align:left;height:500px;width:800px;border:1px solid #ccc;overflow:auto;display:flex;flex-direction:column-reverse;">
        </pres>
    </div>
    <p>Use W/A/S/D to drive the robot</p>

<div class="button-row">
  <button id="stopButton" class="button">Stop</button>
  <button id="forwardButton" class="button">Forward</button>
  <button id="turnLeftButton" class="button">Turn Left</button>
  <button id="turnRightButton" class="button">Turn Right</button>
  <button id="resetEncodersButton" class="button">Reset Encoders</button>
</div>
<br/>
    <div class="container">
      <div class="header-row">
        <div class="label"></div>
        <div class="wheel-title">Left Wheel</div>
        <div class="wheel-title">Right Wheel</div>
      </div>
  
      <div class="data-row">
        <div class="label">Wheel Speed (Rounds per 1000s):</div>
        <div class="value" id="speedL">--</div>
        <div class="value" id="speedR">--</div>
      </div>
  
      <div class="data-row">
        <div class="label">Encoder Count:</div>
        <div class="value" id="countL">--</div>
        <div class="value" id="countR">--</div>
      </div>
  
      <div class="data-row">
        <div class="label">Total Distance (cm):</div>
        <div class="value" id="distanceL">--</div>
        <div class="value" id="distanceR">--</div>
      </div>
    </div>
  </body>
</html>
